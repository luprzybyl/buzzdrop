{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl">
    <div class="surface-card p-6 text-center sm:p-8">
        <span class="eyebrow">🔓 Recipient step</span>
        <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-950">{{ original_name }}</h2>
        <p id="status" class="mx-auto mt-3 max-w-xl text-sm leading-6 text-slate-600">Enter password to {% if file_type == 'text' %}view{% else %}download and decrypt{% endif %}.</p>
        <div class="mt-6 space-y-4">
            <input id="password-input" type="password" placeholder="Enter password" class="field-input">
        </div>
        <button id="decrypt-btn" class="btn-primary mt-4 w-full sm:w-auto">
            {% if file_type == 'text' %}Decrypt and View{% else %}Decrypt and Download{% endif %}
        </button>
        <p id="password-status" class="mt-3 text-sm font-medium text-emerald-700" style="display: none;">Password auto-filled. Click to proceed.</p>

        <div id="text-display" class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left" style="display: none;">
            <div class="mb-2 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <h3 class="font-semibold text-slate-900">Decrypted Text:</h3>
                <button id="copy-text-btn" class="btn-secondary px-3 py-2 text-sm">Copy</button>
            </div>
            <pre id="text-content" class="max-h-96 overflow-y-auto whitespace-pre-wrap text-sm text-slate-700"></pre>
        </div>
    </div>
</div>
<script>
window.downloadUrl = "{{ url_for('download_file', file_id=file_id) }}";
window.reportDecryptionUrl = "{{ url_for('report_decryption', file_id=file_id) }}";
window.originalName = "{{ original_name }}";
window.fileType = "{{ file_type }}";
</script>
<script type="module" src="{{ url_for('static', filename='js/view.js') }}" integrity="{{ sri_hash('js/view.js') }}" crossorigin="anonymous"></script>
{% endblock %}
