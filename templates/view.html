{% extends "base.html" %}

{% block content %}
<div class="mx-auto" style="max-width: 42rem;">
    <div class="surface-card p-5 has-text-centered">
        <span class="eyebrow">🔓 Recipient step</span>
        <h2 class="title is-3 has-text-dark mt-4 mb-3">{{ original_name }}</h2>
        <p id="status" class="mx-auto has-text-grey" style="max-width: 34rem;">Enter password to {% if file_type == 'text' %}view{% else %}download and decrypt{% endif %}.</p>
        <div class="field mt-5">
            <div class="control">
                <input id="password-input" type="password" placeholder="Enter password" class="input field-input">
            </div>
        </div>
        <button id="decrypt-btn" class="button btn-primary mt-4">
            {% if file_type == 'text' %}Decrypt and View{% else %}Decrypt and Download{% endif %}
        </button>
        <p id="password-status" class="mt-3 has-text-success has-text-weight-semibold" style="display: none;">Password auto-filled. Click to proceed.</p>

        <div id="text-display" class="text-note-box mt-5 has-text-left" style="display: none;">
            <div class="is-flex is-flex-direction-column is-justify-content-space-between is-align-items-flex-start mb-3" style="gap: 0.75rem;">
                <h3 class="has-text-weight-semibold has-text-dark mb-0">Decrypted Text:</h3>
                <button id="copy-text-btn" class="button btn-secondary is-small" type="button">Copy</button>
            </div>
            <pre id="text-content" class="has-text-grey-dark" style="max-height: 24rem; overflow-y: auto; white-space: pre-wrap;"></pre>
        </div>
    </div>
</div>
<script>
window.downloadUrl = "{{ url_for('download_file', file_id=file_id) }}";
window.reportDecryptionUrl = "{{ url_for('report_decryption', file_id=file_id) }}";
window.originalName = "{{ original_name }}";
window.fileType = "{{ file_type }}";
</script>
<script type="module" src="{{ url_for('static', filename='js/view.js') }}" integrity="{{ sri_hash('js/view.js') }}" crossorigin="anonymous"></script>
{% endblock %}
