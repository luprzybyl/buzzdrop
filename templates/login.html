{% extends "base.html" %}

{% block content %}
<div class="mx-auto flex max-w-md flex-col justify-center py-6">
    <div class="surface-card animate-zoom-in p-8">
        <div class="text-center">
            <span class="mx-auto mb-6 block h-16 w-16">
                <svg viewBox="0 0 64 64" class="h-16 w-16 text-honey-300" fill="none" aria-hidden="true">
                    <path d="M32 4 54 16.7v25.6L32 55 10 42.3V16.7z" stroke="currentColor" stroke-width="1.5" opacity=".4"/>
                    <path d="M32 11 48 20.2v18.6L32 48l-16-9.2V20.2z" fill="currentColor" opacity=".08"/>
                    <rect x="24" y="30" width="16" height="13" rx="3" stroke="currentColor" stroke-width="2.2"/>
                    <path d="M27.5 30v-4.5a4.5 4.5 0 0 1 9 0V30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="eyebrow">Private access</span>
            <h1 class="mt-5 text-2xl font-semibold tracking-tight text-white">Enter the hive</h1>
            <p class="mt-3 text-sm leading-relaxed text-slate-400">
                Sign in to upload encrypted drops, manage one-time links, and see who opened them.
            </p>
        </div>

        <form method="POST" class="mt-8 space-y-5">
            <div>
                <label for="username" class="field-label">Username</label>
                <input type="text" name="username" id="username" required autocomplete="username" autofocus class="field-input">
            </div>

            <div>
                <label for="password" class="field-label">Password</label>
                <input type="password" name="password" id="password" required autocomplete="current-password" class="field-input">
            </div>

            <button type="submit" class="btn-primary w-full">
                <span class="relative z-10">Login</span>
            </button>
        </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-600">
        Accounts are provisioned at deploy time through environment variables.
    </p>
</div>
{% endblock %}
