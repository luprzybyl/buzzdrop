{% extends "base.html" %}

{% block content %}
<div class="mx-auto" style="max-width: 32rem;">
    <div class="surface-card p-5">
        <div class="has-text-centered">
            <span class="eyebrow">🔐 Private access</span>
            <h2 class="title is-3 has-text-dark mt-4 mb-3">Login</h2>
            <p class="has-text-grey">Step into the hive to upload encrypted drops, manage one-time links, and monitor who opened them.</p>
        </div>

        <form method="POST" class="mt-5">
            <div class="field">
                <label for="username" class="field-label">Username</label>
                <div class="control">
                    <input type="text" name="username" id="username" required class="input field-input">
                </div>
            </div>

            <div class="field mt-4">
                <label for="password" class="field-label">Password</label>
                <div class="control">
                    <input type="password" name="password" id="password" required class="input field-input">
                </div>
            </div>

            <div class="mt-5">
                <button type="submit" class="button btn-primary is-fullwidth is-medium">Login</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
