{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="surface-card p-6 sm:p-8">
        <div class="text-center">
            <span class="eyebrow">🔐 Private access</span>
            <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-950">Login</h2>
            <p class="mt-3 text-sm leading-6 text-slate-600">Step into the hive to upload encrypted drops, manage one-time links, and monitor who opened them.</p>
        </div>

        <form method="POST" class="mt-8 space-y-5">
            <div>
                <label for="username" class="field-label">Username</label>
                <input type="text" name="username" id="username" required class="field-input">
            </div>

            <div>
                <label for="password" class="field-label">Password</label>
                <input type="password" name="password" id="password" required class="field-input">
            </div>

            <div class="pt-2">
                <button type="submit" class="btn-primary w-full">
                    Login
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
