name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t buzzdrop-test .
      - name: Run pytest in Docker container
        run: docker run --rm -v ${{ github.workspace }}/uploads:/app/uploads buzzdrop-test pytest
      - name: Smoke-test db.json migration
        run: docker run --rm buzzdrop-test sh -c "echo '{\"files\":{\"1\":{\"id\":\"smoke-1\",\"original_name\":\"a.txt\",\"path\":\"uploads/smoke-1\"}},\"api_tokens\":{}}' > /tmp/db.json && python migrate_db.py --source /tmp/db.json --target /tmp/migrated.db"
